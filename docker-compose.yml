# Hackathon Project — full stack.
#
#   docker compose up -d          # Postgres + migrations + API + web
#   docker compose up -d postgres # just the database for local dev
#   docker compose logs -f api
#   docker compose down -v        # stop and DELETE the database volume

name: hackathon

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-hackathon}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-hackathon}
      POSTGRES_DB: ${DATABASE_NAME:-hackathon}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-hackathon} -d ${DATABASE_NAME:-hackathon}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [app]

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    restart: "no"
    entrypoint: ["/app/migrate"]
    command: ["-env", "", "up"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-hackathon}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-hackathon}
      DATABASE_NAME: ${DATABASE_NAME:-hackathon}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-disable}
      LOG_FORMAT: ${LOG_FORMAT:-console}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_AUTO_MIGRATE: "false"
      HTTP_PORT: 8080
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-hackathon}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-hackathon}
      DATABASE_NAME: ${DATABASE_NAME:-hackathon}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-disable}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-console}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [app]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    networks: [app]

volumes:
  postgres-data:

networks:
  app:
    driver: bridge

name: Deploy

# Continuous deployment. On every push to main the self-hosted runner (which
# lives ON the deploy server) rebuilds and restarts the Docker Compose stack.
on:
  push:
    branches: [main]
    # Docs-only and tracker changes don't affect the running app — skip deploys.
    paths-ignore:
      - "**.md"
      - "tracker/**"
      - ".gitignore"
      - "LICENSE"

# Never let two deploys run at once; let the newest finish rather than cancel
# a half-applied one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy stack
    runs-on: [self-hosted, hackathon]
    environment: production
    env:
      # Public origin of the app. nginx on this server terminates TLS for
      # anchorone.dcix.in and proxies / -> :20000 (web) and /api/ -> :20080
      # (API), so the browser only ever talks HTTPS to one origin. This value is
      # baked into the frontend at build time.
      PUBLIC_ORIGIN: "https://anchorone.dcix.in"
      # Raw address of this server, still reachable on the direct ports.
      DEPLOY_HOST: "69.164.244.74"
      COMPOSE_FILES: "-f docker-compose.yml -f docker-compose.prod.yml"
    steps:
      - uses: actions/checkout@v4

      - name: Compute version tag
        id: ver
        run: echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Write production .env
        run: |
          cat > .env <<EOF
          VERSION=${{ steps.ver.outputs.version }}
          APP_ENV=production
          API_PORT=20080
          WEB_PORT=20000
          DATABASE_USER=hackathon
          DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
          DATABASE_NAME=hackathon
          # prefer = try TLS, fall back to plaintext on the internal Docker
          # network. Production config forbids sslmode=disable; the bundled
          # Postgres has no TLS, so 'require' can't connect — 'prefer' does.
          DATABASE_SSL_MODE=prefer
          DATABASE_PORT=5432
          LOG_LEVEL=info
          LOG_FORMAT=json
          # Same-origin through the nginx TLS terminator. An https:// page may
          # not call an http:// API — the browser blocks it as mixed content —
          # so this must stay https once the domain is live.
          NEXT_PUBLIC_API_URL=${PUBLIC_ORIGIN}/api/v1
          CORS_ALLOWED_ORIGINS=${PUBLIC_ORIGIN},http://${DEPLOY_HOST}:20000
          # AI integrations. Both are optional: when a key is absent the API
          # still boots and that feature reports itself unavailable, so a
          # missing secret degrades the demo instead of failing the deploy.
          AI_GEMINI_API_KEY=${{ secrets.AI_GEMINI_API_KEY }}
          AI_DEEPGRAM_API_KEY=${{ secrets.AI_DEEPGRAM_API_KEY }}
          EOF

      - name: Build images
        run: docker compose ${COMPOSE_FILES} build

      - name: Apply database migrations
        run: docker compose ${COMPOSE_FILES} run --rm migrate

      - name: Start / update stack
        run: docker compose ${COMPOSE_FILES} up -d --remove-orphans

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:20080/healthz" >/dev/null 2>&1; then
              echo "API healthy"; exit 0
            fi
            echo "waiting for API... ($i/30)"; sleep 2
          done
          echo "API did not become healthy"; docker compose ${COMPOSE_FILES} logs --tail=50 api; exit 1

      - name: Show running services
        run: docker compose ${COMPOSE_FILES} ps

      - name: Prune dangling images
        if: always()
        run: docker image prune -f
